# กำหนดว่า "live DQ gate" ตัวไหนต้องรันตอนไหน — gate = Notebook/Pipeline ที่มี check (Great Expectations)
# อยู่ข้างใน แล้ว CI สั่งรันจริงบน Fabric ผ่าน REST API และ fail ถ้า item นั้น fail
# (scripts/run_live_dq_gates.py เป็นตัวอ่านไฟล์นี้ — เพิ่ม gate ใหม่ = เพิ่ม entry ที่นี่ ไม่ต้องแก้ fabric-ci.yml)
#
# ต่างจาก check pattern 5 แบบใน ci-config.yml: pattern เหล่านั้นตรวจ "definition" ของ item ก่อน deploy
# ส่วน live gate ต้องมี item deploy/sync อยู่ใน workspace จริงก่อนถึงรันได้ จึงเป็นอีก job หนึ่งต่างหาก
#   stage dev  -> job dq-gate-dev  : รันบน PR → main ใน workspace dev    (ก่อน deploy ไป prod)
#   stage prod -> job dq-gate-poc  : รันหลัง deploy-prod ใน workspace prod (ยืนยันหลัง deploy)
#
# field ต่อ entry (ชื่อ key = ชื่อ item ใน Fabric):
#   item_type : notebook | pipeline
#   stages    : list ของ dev / prod ที่ต้องรัน gate นี้ (workspace ID อ่านจาก workspace-config.yml)
#
# ตอนนี้ยังไม่มี gate — job ทั้งสองจะแจ้ง notice ว่าไม่มี gate แล้วผ่านเฉยๆ
# ตัวอย่าง (ผู้เรียนเพิ่มตอนทำ DQ gate — ดู docs/lab-dq-gate-notebook-code.py):
#
# nb_<ชื่อ>_dq:
#   item_type: notebook
#   stages: [dev, prod]
